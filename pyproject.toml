[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "djangorestframework>=3.16.1",
    "imagekitio>=5.2.0",
    "markdown>=3.10.2",
    "pytest-django>=4.12.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.9",
    "djangorestframework-stubs>=3.16.8",
]

[tool.pyright]
pythonVersion = "3.12"
djangoStubsInterface = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "video_platform.settings"
pythonpath = ["video_platform"]
# -- recommended but optional:
python_files = ["test_*.py", "*_test.py", "testing/python/*.py"]